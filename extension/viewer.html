<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Responsive Viewer</title>
		<style>
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; }
			body { display: flex; flex-direction: column; background: #e9e7e1; color: #1f1e1d;
				font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
			header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #1f1e1d; color: #fff; }
			form { display: flex; flex: 1 1 320px; gap: 6px; }
			input { font: inherit; color: #1f1e1d; background: #fff; border: 0; border-radius: 6px; padding: 7px 10px; }
			#url { flex: 1; min-width: 0; }
			#width { width: 76px; }
			button { font: inherit; font-weight: 500; color: inherit; background: rgba(255,255,255,.1); border: 0; border-radius: 6px;
				padding: 7px 10px; cursor: pointer; white-space: nowrap; }
			button:hover { background: rgba(255,255,255,.2); }
			button.on { background: #d97757; }
			.presets { display: flex; flex-wrap: wrap; gap: 4px; }
			.presets small { opacity: .65; margin-left: 4px; font-weight: 400; }
			#info { margin-left: auto; opacity: .7; font-variant-numeric: tabular-nums; }
			main { position: relative; flex: 1; overflow: hidden; }
			#frame-wrap { position: absolute; top: 16px; left: 50%; transform-origin: top center; background: #fff;
				box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 10px 40px rgba(0,0,0,.15); }
			iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }
		</style>
	</head>
	<body>
		<header>
			<form id="nav">
				<input id="url" type="text" placeholder="https://site.test" spellcheck="false" />
				<button type="button" id="reload" title="Reload">↻</button>
				<button type="button" id="open" title="Open in a normal tab">↗</button>
			</form>
			<div class="presets" id="presets"></div>
			<input id="width" type="number" min="200" max="3840" title="Custom width" />
			<button id="rotate" title="Swap width and height">⟲</button>
			<span id="info"></span>
		</header>
		<main id="stage">
			<div id="frame-wrap"><iframe id="frame"></iframe></div>
		</main>
		<script src="viewer.js"></script>
	</body>
</html>
