<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Claude Comments</title>
		<style>
			:root { --bg: #f4f2ec; --card: #fff; --ink: #1f1e1d; --muted: #6b6964; --line: #e2dfd6; --accent: #d97757; }
			@media (prefers-color-scheme: dark) {
				:root { --bg: #1a1918; --card: #252321; --ink: #ecebe7; --muted: #a09d96; --line: #383532; }
			}
			* { box-sizing: border-box; }
			[hidden] { display: none !important; }
			body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
			header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
				padding: 14px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
			h1 { margin: 0 12px 0 0; font-size: 17px; }
			select, button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
			button:hover { border-color: var(--muted); }
			main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 24px; }
			.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
			.shot { display: block; aspect-ratio: 16 / 10; background: var(--line); }
			.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
			.body { display: flex; flex-direction: column; gap: 8px; padding: 14px; flex: 1; }
			.head { display: flex; gap: 8px; align-items: center; font-weight: 600; }
			.chip { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; background: #fbe9e2; color: #a3492a; }
			.chip.resolved { background: #e2f3e7; color: #2c7343; }
			.chip.needs_info { background: #faf0d2; color: #7d5f0d; }
			.vp { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); }
			.text { white-space: pre-wrap; word-break: break-word; }
			.meta { color: var(--muted); font-size: 12px; word-break: break-all; }
			.meta a { color: inherit; }
			.note { padding: 8px 10px; background: var(--bg); border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
			.actions { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
			.chip.in_progress { background: #e1ecfb; color: #2457a6; }
			.card.in_progress { border-color: #8fb3ea; box-shadow: 0 0 0 1px #8fb3ea; }
			.card.needs_info { border-color: #e2c672; }
			.working { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #2457a6; }
			.working::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
			@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
			.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 14px 24px 0; font-size: 13px; color: var(--muted); }
			.summary strong { color: var(--ink); }
			.summary .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
			.progress { flex-basis: 100%; height: 6px; display: flex; overflow: hidden; border-radius: 3px; background: var(--line); }
			.progress span { display: block; height: 100%; transition: width .4s; }
			.group { grid-column: 1 / -1; margin: 8px 0 -4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
			.group:first-child { margin-top: 0; }
			.thread { display: flex; flex-direction: column; gap: 6px; }
			.msg { padding: 8px 10px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word; background: var(--bg); }
			.msg.user { margin-left: 24px; background: transparent; border: 1px solid var(--line); }
			.msg b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
			.reply { display: flex; flex-direction: column; gap: 6px; }
			.reply textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px;
				padding: 8px; min-height: 64px; resize: vertical; }
			.reply textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
			.reply .row { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
			.reply .row span { margin-right: auto; font-size: 11px; color: var(--muted); }
			button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
			button:disabled { opacity: .5; cursor: default; }
			.pills { display: inline-flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
			.pills button { border: 0; border-radius: 999px; padding: 5px 12px; background: transparent; color: var(--muted); font-weight: 500; }
			.pills button:hover { color: var(--ink); }
			.pills button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
			.pills .n { margin-left: 4px; opacity: .7; font-variant-numeric: tabular-nums; }
			.usage { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); }
			.meter { display: grid; gap: 3px; min-width: 120px; }
			.meter .top { display: flex; justify-content: space-between; gap: 8px; }
			.meter strong { color: var(--ink); font-variant-numeric: tabular-nums; }
			.meter .track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
			.meter .fill { height: 100%; background: #3f9b5a; transition: width .4s; }
			.meter .fill.warn { background: #c99a1e; }
			.meter .fill.high { background: #c0453a; }
			.usage .refresh { padding: 4px 8px; font-size: 12px; }
			.panel { margin: 14px 24px 0; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
				display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
			.panel .grow { flex: 1; min-width: 200px; }
			.panel .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
			.panel.running { border-color: #8fb3ea; }
			.panel.failed { border-color: #e0a39a; }
			.panel details { flex-basis: 100%; font-size: 12px; }
			.panel summary { cursor: pointer; color: var(--muted); }
			.panel ol { margin: 8px 0 0; padding: 0; list-style: none; max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 3px;
				font: 12px/1.45 ui-monospace, Menlo, monospace; }
			.panel li { white-space: pre-wrap; overflow-wrap: anywhere; }
			.panel li.text { font-family: inherit; color: var(--ink); }
			.panel li.tool { color: var(--muted); }
			.panel li.error { color: #c0453a; }
			.panel li.done { color: #2c7343; }
			.result { flex-basis: 100%; white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px 10px; background: var(--bg); border-radius: 6px; max-height: 240px; overflow: auto; }
			.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
			@media (max-width: 640px) { header, main, .summary { padding-left: 16px; padding-right: 16px; } .panel { margin-left: 16px; margin-right: 16px; } .usage { margin-left: 0; flex-basis: 100%; } main { grid-template-columns: 1fr; } }
		</style>
	</head>
	<body>
		<header>
			<h1>Claude Comments</h1>
			<select id="site"></select>
			<div class="pills" id="status" role="group" aria-label="Status">
				<button type="button" data-status="open,in_progress,needs_info" aria-pressed="true">Open<span class="n"></span></button>
				<button type="button" data-status="resolved" aria-pressed="false">Resolved<span class="n"></span></button>
				<button type="button" data-status="all" aria-pressed="false">All<span class="n"></span></button>
			</div>
			<div class="usage" id="usage" title="Your Claude plan usage across all sessions, including interactive ones"></div>
			<div class="pills" id="model" role="group" aria-label="Model for Action runs">
				<button type="button" data-model="" aria-pressed="false" title="Your Claude Code default model">Default</button>
				<button type="button" data-model="opus" aria-pressed="false" title="Most capable, uses the most of your plan">Opus</button>
				<button type="button" data-model="sonnet" aria-pressed="false" title="Good for most fixes, uses much less of your plan">Sonnet</button>
				<button type="button" data-model="haiku" aria-pressed="false" title="Fastest and lightest. Best for simple tweaks">Haiku</button>
			</div>
			<button type="button" id="action" class="primary" disabled>Action comments</button>
		</header>
		<div class="panel" id="run" hidden></div>
		<div class="panel" id="storage" hidden></div>
		<div class="summary" id="summary" hidden></div>
		<main id="list"></main>
		<script>
			const params = new URLSearchParams(location.search);
			const siteEl = document.getElementById('site');
			const statusEl = document.getElementById('status');
			const actionEl = document.getElementById('action');
			const runEl = document.getElementById('run');
			const usageEl = document.getElementById('usage');
			const modelEl = document.getElementById('model');
			const storageEl = document.getElementById('storage');
			const OPEN = 'open,in_progress,needs_info';
			let status = OPEN;
			let run = { running: false };
			const list = document.getElementById('list');
			const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

			const summaryEl = document.getElementById('summary');
			const STATUS_LABEL = { open: 'queued', in_progress: 'working on it', needs_info: 'needs info', resolved: 'resolved' };
			const GROUPS = [
				['in_progress', 'Claude is working on'],
				['needs_info', 'Needs your input'],
				['open', 'Queued for Claude'],
				['resolved', 'Resolved'],
			];
			const drafts = {}; // reply drafts by comment id, kept across re-renders
			let lastJson = '';

			function ago(iso) {
				const s = (Date.now() - new Date(iso)) / 1000;
				if (s < 60) return 'just now';
				if (s < 3600) return `${Math.floor(s / 60)}m ago`;
				if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
				return `${Math.floor(s / 86400)}d ago`;
			}

			async function loadSites() {
				const sites = await fetch('/api/sites').then((r) => r.json());
				const wanted = siteEl.options.length ? siteEl.value : params.get('site');
				siteEl.innerHTML = '<option value="">All sites</option>' +
					sites.map((s) => `<option value="${esc(s.site)}">${esc(s.site)} (${s.open + s.in_progress + s.needs_info} open)</option>`).join('');
				if (wanted && sites.some((s) => s.site === wanted)) siteEl.value = wanted;
			}

			// Counts for the current site, plus comments resolved today so the bar shows how far through Claude is.
			async function renderSummary() {
				const q = new URLSearchParams({ status: 'all' });
				if (siteEl.value) q.set('site', siteEl.value);
				const all = await fetch(`/api/comments?${q}`).then((r) => r.json());
				const pillCounts = { [OPEN]: all.filter((c) => c.status !== 'resolved').length, resolved: all.filter((c) => c.status === 'resolved').length, all: all.length };
				for (const b of statusEl.querySelectorAll('button')) b.querySelector('.n').textContent = pillCounts[b.dataset.status];
				renderActionButton(all.filter((c) => c.status === 'open' || c.status === 'in_progress').length);
				if (status === 'resolved') return (summaryEl.hidden = true);
				const today = new Date().toDateString();
				const n = (status) => all.filter((c) => c.status === status).length;
				const counts = {
					in_progress: n('in_progress'),
					needs_info: n('needs_info'),
					open: n('open'),
					resolved: all.filter((c) => c.status === 'resolved' && c.resolvedAt && new Date(c.resolvedAt).toDateString() === today).length,
				};
				const total = Object.values(counts).reduce((a, b) => a + b, 0);
				const colours = { resolved: '#3f9b5a', in_progress: '#2457a6', needs_info: '#c99a1e', open: 'var(--accent)' };
				const labels = { resolved: 'resolved today', in_progress: 'in progress', needs_info: 'need your input', open: 'queued' };
				const order = ['resolved', 'in_progress', 'needs_info', 'open'];
				summaryEl.hidden = !total;
				summaryEl.innerHTML =
					order.map((k) => `<span><span class="dot" style="background:${colours[k]}"></span><strong>${counts[k]}</strong> ${labels[k]}</span>`).join('') +
					`<div class="progress">${order.map((k) => `<span style="width:${total ? (counts[k] / total) * 100 : 0}%;background:${colours[k]}"></span>`).join('')}</div>`;
			}

			const formatBytes = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`);

			function renderActionButton(pending) {
				const site = siteEl.value;
				actionEl.disabled = !site || !pending || run.running;
				actionEl.textContent = run.running ? 'Claude is working…' : pending ? `Action ${pending} comment${pending === 1 ? '' : 's'}` : 'Nothing to action';
				actionEl.title = !site ? 'Pick a site first' : `Runs /action-comments for ${site} with Claude Code`;
			}

			async function renderRun() {
				const site = siteEl.value;
				run = site ? await fetch(`/api/run?site=${encodeURIComponent(site)}`).then((r) => r.json()) : { running: false };
				if (!run.startedAt || (!run.running && !run.log.length && !run.result)) return (runEl.hidden = true);
				const failed = !run.running && run.exitCode !== 0;
				const openLog = runEl.querySelector('details')?.open;
				const scroller = runEl.querySelector('ol');
				const prevTop = scroller?.scrollTop || 0;
				const atBottom = !scroller || scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 20;
				runEl.hidden = false;
				runEl.className = `panel ${run.running ? 'running' : failed ? 'failed' : ''}`;
				runEl.innerHTML = `
					<div class="grow">
						${run.running
							? `<div class="working">Claude is actioning ${run.pending} comment${run.pending === 1 ? '' : 's'} · started ${ago(run.startedAt)} · ${esc(run.model)}</div>`
							: `<strong>${run.stopped ? 'Run stopped' : failed ? 'Run failed' : 'Run finished'}</strong> · ${ago(run.finishedAt)}${run.cost != null ? ` · <span title="What this run would cost at API prices. On a Claude subscription it isn't billed. It counts towards your plan's usage limits instead.">≈ $${run.cost.toFixed(2)} API-equivalent</span>` : ''}`}
						<div class="sub">${esc(run.activity)}</div>
					</div>
					${run.running ? '<button type="button" data-run="stop">Stop</button>' : ''}
					${!run.running && run.result ? `<div class="result">${esc(run.result)}</div>` : ''}
					${run.log.length ? `<details ${openLog ? 'open' : ''}><summary>Activity (${run.log.length})</summary>
						<ol>${run.log.map((l) => `<li class="${l.kind}">${esc(l.text)}</li>`).join('')}</ol>
					</details>` : ''}`;
				const ol = runEl.querySelector('ol');
				if (ol) ol.scrollTop = atBottom ? ol.scrollHeight : prevTop;
			}

			function renderModel(model) {
				for (const b of modelEl.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.model === (model || '')));
			}

			function meter(label, w) {
				if (!w) return '';
				const pct = Math.round(w.utilization * 100);
				const resets = new Date(w.resetsAt);
				const soon = resets - Date.now() < 86400000;
				const when = soon ? resets.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : resets.toLocaleDateString([], { weekday: 'short', hour: 'numeric' });
				return `<div class="meter" title="Resets ${resets.toLocaleString()}">
					<div class="top"><span>${label} <strong>${pct}%</strong></span><span>resets ${when}</span></div>
					<div class="track"><div class="fill ${pct >= 90 ? 'high' : pct >= 70 ? 'warn' : ''}" style="width:${Math.min(pct, 100)}%"></div></div>
				</div>`;
			}

			let usageRefreshing = false;
			async function renderUsage() {
				const u = await fetch('/api/usage').then((r) => r.json());
				usageEl.innerHTML = u.checkedAt
					? `${meter('Session', u.fiveHour)}${meter('Week', u.sevenDay)}
						<button type="button" class="refresh" title="Checked ${ago(u.checkedAt)}. Refreshing sends a tiny Haiku request." ${usageRefreshing ? 'disabled' : ''}>${usageRefreshing ? '…' : '↻'}</button>`
					: `<button type="button" class="refresh" ${usageRefreshing ? 'disabled' : ''}>${usageRefreshing ? 'Checking usage…' : 'Show plan usage'}</button>`;
				return u;
			}

			async function refreshUsage() {
				usageRefreshing = true;
				renderUsage();
				await fetch('/api/usage', { method: 'POST' }).catch(() => {});
				usageRefreshing = false;
				renderUsage();
			}

			async function renderStorage() {
				if (status !== 'resolved') return (storageEl.hidden = true);
				const site = siteEl.value;
				const usage = await fetch(`/api/storage${site ? `?site=${encodeURIComponent(site)}` : ''}`).then((r) => r.json());
				const clearable = usage.resolved.bytes + usage.orphans.bytes;
				storageEl.hidden = !clearable;
				if (!clearable) return;
				storageEl.innerHTML = `
					<div class="grow">
						<strong>Screenshots: ${formatBytes(usage.total.bytes + usage.orphans.bytes)}</strong>
						<div class="sub">${formatBytes(usage.resolved.bytes)} from ${usage.resolved.count} resolved comment${usage.resolved.count === 1 ? '' : 's'}${
							usage.orphans.count ? ` · ${formatBytes(usage.orphans.bytes)} left over from deleted comments` : ''}${site ? ` on ${esc(site)}` : ''}.
							Clearing keeps the comments and their notes.</div>
					</div>
					<button type="button" data-clear ${clearable ? '' : 'disabled'}>Clear ${formatBytes(clearable)}</button>`;
			}

			function card(c) {
				const thread = c.thread || [];
				const noteInThread = thread.some((m) => m.from === 'claude' && m.text === c.resolution);
				// Older needs-info comments only have the question in `resolution`.
				const messages = c.status === 'needs_info' && c.resolution && !noteInThread ? [...thread, { from: 'claude', text: c.resolution }] : thread;
				return `
					<article class="card ${c.status}">
						${c.screenshot ? `<a class="shot" href="/screenshots/${c.id}.png" target="_blank"><img loading="lazy" src="/screenshots/${c.id}.png" alt=""></a>` : ''}
						<div class="body">
							<div class="head">#${c.number} <span class="chip ${c.status}">${STATUS_LABEL[c.status] || c.status}</span>
								<span class="vp">${c.viewport?.width}px · ${c.viewport?.breakpoint}</span></div>
							<div class="text">${esc(c.text)}</div>
							<div class="meta"><a href="${esc(c.url)}" target="_blank">${esc(c.site + c.path)}</a> · ${new Date(c.createdAt).toLocaleString()}</div>
							<div class="meta"><code>${esc(c.element?.selector)}</code></div>
							${c.status === 'in_progress' ? `<div class="working">Claude is working on this · started ${ago(c.startedAt || c.updatedAt)}</div>` : ''}
							${messages.length ? `<div class="thread">${messages.map((m) => `<div class="msg ${m.from}"><b>${m.from === 'claude' ? 'Claude' : 'You'}</b>${esc(m.text)}</div>`).join('')}</div>` : ''}
							${c.resolution && !messages.some((m) => m.text === c.resolution) ? `<div class="note"><strong>Claude:</strong> ${esc(c.resolution)}</div>` : ''}
							${c.status === 'needs_info' ? `
								<form class="reply" data-id="${c.id}">
									<textarea name="reply" placeholder="Answer Claude's question…" data-id="${c.id}">${esc(drafts[c.id] || '')}</textarea>
									<div class="row"><span>⌘↵ to send · goes back in the queue</span><button class="primary" type="submit">Send to Claude</button></div>
								</form>` : ''}
							<div class="actions">
								${c.status === 'resolved'
									? `<button data-id="${c.id}" data-status="open">Reopen</button>`
									: `<button data-id="${c.id}" data-status="resolved" title="Close without Claude actioning it">Close comment</button>`}
								<button data-id="${c.id}" data-delete>Delete</button>
							</div>
						</div>
					</article>`;
			}

			async function render({ force = true } = {}) {
				const q = new URLSearchParams({ status: status });
				if (siteEl.value) q.set('site', siteEl.value);
				const comments = (await fetch(`/api/comments?${q}`).then((r) => r.json())).reverse();
				const wasRunning = run.running;
				await renderRun();
				if (run.running || wasRunning) renderUsage(); // runs report fresh usage as they go
				renderSummary();
				renderStorage();

				// Polling only redraws when something changed, so typing and scrolling aren't disturbed.
				const json = JSON.stringify(comments);
				if (!force && json === lastJson) return;
				lastJson = json;

				const focused = document.activeElement?.matches?.('textarea[data-id]') ? document.activeElement : null;
				const focus = focused && { id: focused.dataset.id, start: focused.selectionStart, end: focused.selectionEnd };

				if (!comments.length) return (list.innerHTML = '<div class="empty">No comments here.</div>');
				const grouped = status !== 'resolved';
				list.innerHTML = grouped
					? GROUPS.map(([status, title]) => {
							const items = comments.filter((c) => c.status === status);
							return items.length ? `<h2 class="group">${title} (${items.length})</h2>${items.map(card).join('')}` : '';
						}).join('')
					: comments.map(card).join('');

				if (focus) {
					const ta = list.querySelector(`textarea[data-id="${focus.id}"]`);
					ta?.focus();
					ta?.setSelectionRange(focus.start, focus.end);
				}
			}

			async function refresh() {
				await loadSites();
				await render();
			}

			list.addEventListener('click', async (e) => {
				const btn = e.target.closest('button[data-id]');
				if (!btn) return;
				if (btn.hasAttribute('data-delete')) {
					if (!confirm('Delete this comment?')) return;
					await fetch(`/api/comments/${btn.dataset.id}`, { method: 'DELETE' });
				} else {
					await fetch(`/api/comments/${btn.dataset.id}`, {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ status: btn.dataset.status }),
					});
				}
				refresh();
			});

			list.addEventListener('input', (e) => {
				if (e.target.matches('textarea[data-id]')) drafts[e.target.dataset.id] = e.target.value;
			});

			list.addEventListener('keydown', (e) => {
				if (e.target.matches('textarea[data-id]') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
					e.preventDefault();
					e.target.form.requestSubmit();
				}
			});

			list.addEventListener('submit', async (e) => {
				e.preventDefault();
				const form = e.target;
				const reply = form.reply.value.trim();
				if (!reply) return form.reply.focus();
				const button = form.querySelector('button');
				button.disabled = true;
				const res = await fetch(`/api/comments/${form.dataset.id}`, {
					method: 'PATCH',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ reply }),
				});
				if (!res.ok) {
					button.disabled = false;
					return alert((await res.json().catch(() => ({}))).error || 'Could not send reply');
				}
				delete drafts[form.dataset.id];
				refresh();
			});

			siteEl.addEventListener('change', () => render());
			statusEl.addEventListener('click', (e) => {
				const btn = e.target.closest('button[data-status]');
				if (!btn) return;
				status = btn.dataset.status;
				for (const b of statusEl.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === btn));
				render();
			});

			async function api(path, options = {}) {
				const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
				const data = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
				return data;
			}

			modelEl.addEventListener('click', async (e) => {
				const btn = e.target.closest('button[data-model]');
				if (!btn) return;
				const { model } = await api('/api/config', { method: 'PATCH', body: JSON.stringify({ model: btn.dataset.model || null }) });
				renderModel(model);
			});

			usageEl.addEventListener('click', (e) => e.target.closest('.refresh') && refreshUsage());

			actionEl.addEventListener('click', async () => {
				actionEl.disabled = true;
				try {
					await api('/api/run', { method: 'POST', body: JSON.stringify({ site: siteEl.value }) });
				} catch (err) {
					alert(err.message);
				}
				render();
			});

			runEl.addEventListener('click', async (e) => {
				if (!e.target.closest('[data-run=stop]')) return;
				if (!confirm('Stop Claude? Changes it has already made stay in place.')) return;
				await api(`/api/run?site=${encodeURIComponent(siteEl.value)}`, { method: 'DELETE' }).catch((err) => alert(err.message));
				render();
			});

			storageEl.addEventListener('click', async (e) => {
				if (!e.target.closest('[data-clear]')) return;
				if (!confirm('Delete the screenshots of resolved comments? The comments and notes are kept. This can\'t be undone.')) return;
				const site = siteEl.value;
				const { freed } = await api(`/api/screenshots${site ? `?site=${encodeURIComponent(site)}` : ''}`, { method: 'DELETE' });
				alert(`Freed ${formatBytes(freed)}.`);
				render();
			});
			window.addEventListener('focus', refresh);
			setInterval(() => document.visibilityState === 'visible' && render({ force: false }), 2500);
			refresh();
			fetch('/api/config').then((r) => r.json()).then((c) => renderModel(c.model));
			// Fetch fresh usage when the dashboard opens, at most every 15 minutes.
			renderUsage().then((u) => (!u.checkedAt || Date.now() - new Date(u.checkedAt) > 15 * 60000) && refreshUsage());
		</script>
	</body>
</html>
